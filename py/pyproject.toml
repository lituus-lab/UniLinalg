[build-system]
requires = ["setuptools>=77.0.0", "wheel", "Cython>=3.0"]
build-backend = "setuptools.build_meta"

[project]
name = "unilinalg"
version = "1.0.0"
description = "Python binding for the UniLinalg C library"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [{ name = "lituus-lab" }]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]
# Builds py/notebooks/quickstart.ipynb via py/notebooks/build_quickstart.py.
notebook = ["nbformat>=5", "nbclient>=0.10", "ipykernel"]

[tool.setuptools]
packages = ["unilinalg"]
