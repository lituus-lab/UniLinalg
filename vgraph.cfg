# Dependency directions checked by `nimble checkVGraph`. See ADR-0001.

# Layers inside src/, lowest first. A module may import its own layer and any
# lower one, never a higher one. algorithms/{lu,cholesky,qr,svd} may import
# types/{matrix,sparse,vector,tolerance}, never the other way around.
[layers]
types
algorithms
c_api

# Similarly-prefixed packages this repo may name in `requires` (ADR-0001).
# UniMath is the sole domain dependency. Adding another name is a deliberate,
# reviewed exception, not a default.
[engines]
UniMath
